let sdk, provider, signer = "";
function setAccount(a, chain) {

async function mobileConnect() {
  log("Загружаем MetaMask SDK для телефона…");
  const mod = await import("https://cdn.jsdelivr.net/npm/@metamask/sdk@0.34.0/+esm");
  sdk = new mod.MetaMaskSDK({
    dappMetadata: { name: "AI Sports (official)", url: location.origin },
    useDeeplink: true, checkInstallationImmediately: false, logging: { developerMode: false },
  });
  const accounts = await sdk.connect();
  return {accounts, provider: sdk.getProvider(), source: "MetaMask Mobile SDK"};
}
async function ensurePolygon() {
  const cid = await provider.request({ method: "eth_chainId" });
  log(`chainId: ${cid}`);
  if (cid !== "0x89") {
    log("переключаем сеть на Polygon (0x89) — wallet_switchEthereumChain");
    await provider.request({ method: "wallet_switchEthereumChain", params: [{ chainId: "0x89" }] });
    log(`chainId после переключения: ${await provider.request({ method: "eth_chainId" })}`);
  }
}
async function rpc(name, params) {
  const r = await fetch(SB + "/rpc/" + name, { method: "POST", headers: { "Content-Type": "application/json", apikey: KEY, Authorization: "Bearer " + KEY }, body: JSON.stringify(params) });
  const txt = await r.text(); log(`rpc ${name}: HTTP ${r.status} ${txt.slice(0, 200)}`);
  if (!r.ok) throw new Error(`HTTP ${r.status}`);
  return txt ? JSON.parse(txt) : null;
}
async function contractOwner(tradingAccount) {
  let last = "";
  for (const url of POLYGON_RPCS) {
    try {
      const r = await fetch(url, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({jsonrpc:"2.0", id:1, method:"eth_call", params:[{to:tradingAccount, data:"0x8da5cb5b"}, "latest"]})});
      const j = await r.json();
      if (!r.ok || j.error || !/^0x[0-9a-fA-F]{64}$/.test(String(j.result || ""))) throw new Error((j.error && j.error.message) || `HTTP ${r.status}`);
      const owner = "0x" + j.result.slice(-40).toLowerCase();
      if (/^0x0{40}$/.test(owner)) throw new Error("owner() вернул нулевой адрес");
      return owner;
    } catch (e) { last = e.message || String(e); }
  }
  throw new Error("не удалось проверить owner() через Polygon RPC: " + last);
}
function localTypedData(s) {   // режим «устройство»: тот же формат, что private.wallet_link_typed_data; nonce нулевой, tradingAccount = signer
  const now = Math.floor(Date.now() / 1000);
  return { types: { WalletLink: [{ name: "purpose", type: "string" }, { name: "app", type: "string" }, { name: "network", type: "string" },
                    { name: "tradingAccount", type: "address" }, { name: "signer", type: "address" }, { name: "telegramUserId", type: "uint256" },
                    { name: "nonce", type: "bytes32" }, { name: "issuedAt", type: "uint256" }, { name: "expiresAt", type: "uint256" }] },
    primaryType: "WalletLink", domain: { name: "AI Sports (official)", version: "1", chainId: 137 },
    message: { purpose: "ТЕСТ УСТРОЙСТВА: подпись никуда не отправляется. Только подтверждение контроля кошелька и привязка для просмотра в AI Sports. Не даёт прав на сделки, переводы, approve или вывод средств.",
               app: "AI Sports official — @aisports0bot", network: "Polygon (chainId 137)", tradingAccount: s, signer: s, telegramUserId: "0",
               nonce: "0x" + "00".repeat(32), issuedAt: String(now), expiresAt: String(now + 300) } };
}
async function requestInjectedAccount() {
  try {
    log("MetaMask: открываем выбор аккаунта");
    await window.ethereum.request({method:"wallet_requestPermissions", params:[{eth_accounts:{}}]});
  } catch (e) {
    const code = Number(e && e.code);
    if (code === 4001) throw e;
    log("выбор аккаунта отдельным методом недоступен — используем стандартное подключение");
  }
  let accounts = await window.ethereum.request({method:"eth_accounts"});
  if (!accounts || !accounts.length) accounts = await window.ethereum.request({method:"eth_requestAccounts"});
  return accounts;
}
async function connectMetaMask() {
  $("b1").disabled = true;
  try {
    const ts = Date.now(); let conn;
    if (window.ethereum) {
      log("connect: запрашиваем выбор аккаунта у расширения MetaMask в Chrome");
      const accounts = await requestInjectedAccount();
      conn = {accounts, provider: window.ethereum, source: "MetaMask Chrome"};
    } else conn = await mobileConnect();
    const accounts = conn.accounts; provider = conn.provider;
    log(`connect OK (${conn.source}) за ${((Date.now() - ts) / 1000).toFixed(1)}s: ${accounts.length} аккаунт(ов)`);
    provider.on && provider.on("accountsChanged", a => { setAccount(a[0], null); log("accountsChanged"); });
    provider.on && provider.on("chainChanged", c => log(`chainChanged: ${c}`));
    setAccount(accounts[0], await provider.request({ method: "eth_chainId" }));
    if ($("srv").checked && tg && tg.initData) {
      let already = null;
      try { already = await rpc("wallet_link_status", { p_init_data: tg.initData }); } catch (e) {}
      if (already && already.state === "OWNED" && String(already.signer || "").toLowerCase() === signer) {
        log(`владение уже подтверждено этим аккаунтом (${wvShort(already.trading_account)}) — подпись владения не нужна`);
        if (FLOW) await runFlow(); else $("bAuto").style.display = "block";
      } else await signConfirmation();
    }
  } catch (e) { log("connect failed: " + (e.shortMessage || e.message || e)); }
  finally { $("b1").disabled = false; }
}
$("b1").onclick = connectMetaMask;
$("b3").onclick = async () => {
  if (window.ethereum) { setAccount("", null); await connectMetaMask(); return; }
  try { if (sdk) await sdk.terminate(); } catch (e) {}
  provider = null; setAccount("", null); log("локальная сессия подтверждения закрыта");
};
async function signConfirmation() {
  $("b2").disabled = true;
  try {
    const server = $("srv").checked;
    let td, nonce = "";
    if (server) {
      if (!(tg && tg.initData)) throw new Error("нет initData — режим «сервер» только внутри Telegram");
      const ch = await rpc("wallet_link_challenge", { p_init_data: tg.initData, p_signer: signer });
      if (!ch || ch.status !== "CHALLENGE") throw new Error("challenge: " + JSON.stringify(ch));
      td = ch.typed_data; nonce = ch.nonce;
      if (String(td.message.signer || "").toLowerCase() !== signer) throw new Error("signer в typed_data ≠ подключённому");
      const tradingAccount = String(td.message.tradingAccount || "").toLowerCase();
      if (!/^0x[0-9a-f]{40}$/.test(tradingAccount)) throw new Error("сервер не вернул корректный tradingAccount");
      const expectedOwner = await contractOwner(tradingAccount);
      log(`проверка owner(): ${tradingAccount.slice(0,8)}… → ${expectedOwner}`);
      if (expectedOwner !== signer) {
        $("acc").textContent = `выбран ${signer} · нужен владелец ${expectedOwner}`;
        throw new Error(`выбран не тот аккаунт. В MetaMask выберите ${expectedOwner}`);
      }
      log("аккаунт совпал с владельцем Polymarket — отправляем запрос подписи");
    } else td = localTypedData(signer);
    await ensurePolygon();
    const full = Object.assign({}, td, { types: Object.assign({ EIP712Domain: [{ name: "name", type: "string" }, { name: "version", type: "string" }, { name: "chainId", type: "uint256" }] }, td.types) });
    const ts = Date.now(); log("sign: запрос eth_signTypedData_v4 → MetaMask (ждём возврата в Telegram)");
    const sig = await provider.request({ method: "eth_signTypedData_v4", params: [signer, JSON.stringify(full)] });
    log(`sign OK за ${((Date.now() - ts) / 1000).toFixed(1)}s: длина ${sig.length} (${sig.length === 132 ? "65 байт, формат верный" : "НЕОЖИДАННАЯ длина"}), ${sig.slice(0, 12)}…${sig.slice(-6)}`);
    if (server) {
      const sub = await rpc("wallet_link_submit", { p_init_data: tg.initData, p_nonce: nonce, p_signature: sig });
      log("submit → " + JSON.stringify(sub));
      for (let i = 0; i < 36 && sub && sub.status === "PENDING"; i++) {
        await new Promise(r => setTimeout(r, 5000));
        const st = await rpc("wallet_link_status", { p_init_data: tg.initData });
        if (st && st.state !== "PENDING") {
          log("итог: " + JSON.stringify(st));
          if (st.state === "OWNED") { if (FLOW) await runFlow(); else $("bAuto").style.display = "block"; }
          break;
        }
      }
    }
  } catch (e) { log("sign failed: " + (e.shortMessage || e.message || e)); }
  finally { $("b2").disabled = !signer; }
}
$("b2").onclick = signConfirmation;
// v125: полномочие Session Key Polymarket — подписи только в кошельке; подпись отправляется с idempotency_key подготовленного задания.
// flow=auto: реквизиты владельца (ClobAuth) → полномочие (Batch authorizeSessionSigner: только ордера CLOB, без вывода, 180 дней);
// flow=revoke: локальный стоп уже поставлен витриной, здесь одна подпись отзыва (Batch revokeSessionSigner). Ключей/адресов/Terminal нет.
const FLOW = new URLSearchParams(location.search).get("flow");
const HUMAN = { NOT_OWNED: "Сначала подтвердите владение кошельком", BUSY: "Сервер ещё обрабатывает предыдущий шаг — подождите и нажмите «Повторить»",
  SIGNATURE_FORMAT: "Кошелёк вернул подпись неожиданного формата", NOTHING_TO_SIGN: "Подписывать пока нечего — обновите статус",
  TIMESTAMP_STALE: "Часы устройства расходятся с сервером больше чем на минуту — поправьте время и нажмите «Повторить»", HTTP404: "Сервер автоставок ещё не установлен", PENDING_TIMEOUT: "Сервер не ответил вовремя — нажмите «Повторить»" };
function wvShort(a) { a = String(a || ""); return a ? a.slice(0, 6) + "…" + a.slice(-4) : ""; }
const DENIED = "Polymarket отклонил выдачу торгового разрешения. Проверяем причину доступа; повторная подпись сейчас не требуется.";
function providerText(st) { return st && String(st.reason || "").startsWith("PROVIDER_ACCESS_DENIED") ? DENIED : ""; }
function human(status) { return HUMAN[status] || (String(status || "").startsWith("STATE_") ? "Полномочие уже в состоянии " + String(status).slice(6) : "Ошибка: " + status); }
function autoStatus(text, ok) { const el = $("auto"); el.style.display = "block"; el.textContent = text; el.style.background = ok === true ? "#123a2a" : ok === false ? "#3a1212" : "#141c30"; }
async function grantStatus() { return await rpc("trading_grant_status", { p_init_data: tg.initData }); }
async function waitGrant(pred, seconds) {
  for (let i = 0; i < seconds / 3; i++) {
    const st = await grantStatus();
    if (pred(st)) return st;
    await new Promise(r => setTimeout(r, 3000));
  }
  throw new Error(HUMAN.PENDING_TIMEOUT);
}
function verifyTyped(st, tradingAccount) {
  const td = st.typed_data || {}; const m = td.message || {}; const d = td.domain || {};
  if (st.kind === "owner_creds") {
    if (td.primaryType !== "ClobAuth" || String(m.address || "").toLowerCase() !== signer) throw new Error("typed-data реквизитов не для этого аккаунта");
    return "1/2 · доступ к чтению вашего аккаунта Polymarket (реквизиты только для проверки, ордера этим не разрешаются)";
  }
  if (st.kind === "authorize" || st.kind === "revoke") {
    if (td.primaryType !== "Batch" || Number(d.chainId) !== 137 || String(d.verifyingContract || "").toLowerCase() !== tradingAccount) throw new Error("typed-data полномочия не для этого Deposit Wallet");
    if (!Array.isArray(m.calls) || m.calls.length !== 1) throw new Error("в полномочии больше одного действия — отказ");
    if (!Array.isArray(st.scopes) || st.scopes.some(x => x !== "CLOB")) { if (st.kind === "authorize") throw new Error("полномочие шире, чем «только ордера» — отказ"); }
    return st.kind === "authorize" ? "2/2 · разрешение серверу ставить с этого кошелька: только ордера Polymarket, без вывода средств, до " + new Date(Number(st.valid_until) * 1000).toISOString().slice(0, 10) + ", отключается одной кнопкой"
                                   : "отзыв разрешения: сервер больше не сможет ставить с этого кошелька";
  }
  throw new Error("неизвестный тип подписи: " + st.kind);
}
async function signPending(st, tradingAccount) {
  const what = verifyTyped(st, tradingAccount);
  autoStatus("Подтвердите в кошельке: " + what);
  await ensurePolygon();
  // v126 (23.09): CLOB принимает подпись ClobAuth только ~100 с от её timestamp, поэтому для реквизитов владельца timestamp ставится
  // ЗДЕСЬ, в момент подписи, и передаётся серверу (p_clob_auth_timestamp); worker проверяет подпись по этому же timestamp
  let clobTs = null;
  const td = JSON.parse(JSON.stringify(st.typed_data));
  if (st.kind === "owner_creds") { clobTs = Math.floor(Date.now() / 1000); td.message.timestamp = String(clobTs); }
  const full = Object.assign({}, td, { types: Object.assign({ EIP712Domain: [{ name: "name", type: "string" }, { name: "version", type: "string" }, { name: "chainId", type: "uint256" }].concat(td.domain && td.domain.verifyingContract ? [{ name: "verifyingContract", type: "address" }] : []) }, td.types) });
  const sig = await provider.request({ method: "eth_signTypedData_v4", params: [signer, JSON.stringify(full)] });
  const r = await rpc("trading_grant_sign", {
    p_init_data: tg.initData,
    p_idempotency_key: st.idempotency_key,
    p_signature: sig,
    p_clob_auth_timestamp: clobTs
  });
  if (!r || r.status !== "PENDING") throw new Error(human(r && r.status));
}
async function enableAuto() {
  const link = await rpc("wallet_link_status", { p_init_data: tg.initData });
  if (!link || link.state !== "OWNED" || String(link.signer || "").toLowerCase() !== signer) throw new Error(HUMAN.NOT_OWNED);
  const acct = String(link.trading_account || "").toLowerCase();
  let st = await grantStatus();
  if (st && st.state === "TRADING_AUTHORIZED") { autoStatus("Кошелёк подключён · автоставки включены", true); return; }
  const busy = st && st.job && (st.job.status === "PENDING" || st.job.status === "CLAIMED");
  if (!(st && st.awaiting_signature) && !busy && !(st && (st.state === "AUTHORIZING" || st.state === "UNKNOWN"))) {
    const r = await rpc("trading_grant_request", { p_init_data: tg.initData });
    if (!r || r.status !== "PENDING") throw new Error(human(r && r.status));
  }
  for (let step = 0; step < 3; step++) {
    autoStatus("Готовим подтверждение…");
    st = await waitGrant(s => s && (s.awaiting_signature || s.state === "TRADING_AUTHORIZED" || (!s.job && ["OWNED", "NOT_CONNECTED", "REVOKED", "EXPIRED"].includes(s.state) && step > 0)), 120);
    if (st.state === "TRADING_AUTHORIZED") { autoStatus("Кошелёк подключён · автоставки включены", true); return; }
    if (!st.awaiting_signature) throw new Error(providerText(st) || "Поставщик отклонил полномочие — нажмите «Повторить»");
    await signPending(st, acct);
  }
  st = await waitGrant(s => s && (s.state === "TRADING_AUTHORIZED" || ["OWNED", "REVOKED", "EXPIRED"].includes(s.state)), 300);
  if (st.state === "TRADING_AUTHORIZED") autoStatus("Кошелёк подключён · автоставки включены", true);
  else throw new Error(providerText(st) || "Поставщик не подтвердил полномочие — нажмите «Повторить»");
}
async function revokeAuto() {
  const link = await rpc("wallet_link_status", { p_init_data: tg.initData });
  const acct = String((link && link.trading_account) || "").toLowerCase();
  let st = await grantStatus();
